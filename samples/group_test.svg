<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- 그룹 1: 빨강 사각형 + 파랑 사각형 (한 덩어리로 선택/이동/크기/회전됨) -->
  <g id="group1">
    <path d="M50 50 L150 50 L150 130 L50 130 Z" fill="#ff0000" stroke="#000000" stroke-width="2"/>
    <path d="M180 60 L260 60 L260 120 L180 120 Z" fill="#0000ff" stroke="#000000" stroke-width="2"/>
  </g>
  <!-- 그룹 2: 안에 그룹이 또 들어 있는 중첩 그룹 (레이어 패널의 계층 트리 확인용) -->
  <g id="group2">
    <path d="M320 50 L420 50 L420 130 L320 130 Z" fill="#ffaa00" stroke="#000000" stroke-width="2"/>
    <g id="group2_inner">
      <path d="M440 60 L520 60 L520 120 L440 120 Z" fill="#aa00ff" stroke="#000000" stroke-width="2"/>
      <path d="M450 70 L510 70 L510 110 L450 110 Z" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    </g>
  </g>
  <!-- 그룹에 속하지 않은 도형 (단독 선택 확인용) -->
  <g>
    <path d="M250 230 L330 230 L330 290 L250 290 Z" fill="#00aa00" stroke="#000000" stroke-width="2"/>
  </g>
</svg>
